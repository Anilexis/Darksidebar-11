; Darksidebar-11 - Unified Single Ribbon Skin (Version 3.5 Standalone)
; Strict CSS-like Spacing Architecture & Dynamic Zero-Hardcode Hardware Integration

[Rainmeter]
Update=1000
AccurateText=1
Group=Darksidebar-11
Draggable=0
OnRefreshAction=[!CommandMeasure MeasureAlign "Run"]
ContextTitle=Darksidebar-11 Settings
ContextAction=[!ActivateConfig "Darksidebar-11\Settings" "Settings.ini"][!Move (#CURRENTCONFIGX#+#CURRENTCONFIGWIDTH#-380) (#CURRENTCONFIGY#) "Darksidebar-11\Settings"][!ZPos 1 "Darksidebar-11\Settings"]

[Variables]
; --- Core Defaults & Settings Fallbacks ---
Language=Russian
WeatherCity=London
WeatherLat=51.5074
WeatherLon=-0.1278
WeatherCountryCode=GB
WeatherCountryName=United Kingdom
WeatherUnits=metric
WeatherTempUnit=C
CalendarFirstDay=Monday
ClockHandThickness=Normal
ClockHourLineWidth=3.5
ClockMinuteLineWidth=2.2
CalendarAppType=System
CalendarAppPath=
CalendarAction=["outlookcal:"]
CalendarCursor=2
CalendarToolTip=#LangOpenCalendar#
WeatherAppType=System
WeatherAppPath=
WeatherAction=["msnweather:"]
WeatherCursor=2
WeatherToolTip=#LangOpenWeather#
HolidaysEnabled=1
FirstRunDone=0
MonitorTargetId=
MonitorFriendlyName=Primary
MonitorFallbackDev=\\.\DISPLAY1
PlacementEdge=Right
RightMargin=0
TopMargin=0
HideWhenTargetMissing=0

; Dynamic Tokens Fallbacks
Divider4Y=783
HardwareTitleY=803
HardwareCpuY=828
HardwareCpuBarY=842
HardwareRamY=851
HardwareRamBarY=865
HardwareGpuY=874
HardwareGpuBarY=888
HardwareVramY=896

; Weather Cache Fallbacks
WeatherIcon=cloud
WeatherTemp=--
WeatherDesc=--
WeatherLastUpdated=--
WeatherApparent=--
WeatherHumidity=--
WeatherWindSpeed=--
WeatherWindDir=--
WeatherDay1Name=--
WeatherDay1Min=--
WeatherDay1Max=--
WeatherDay1Desc=--
WeatherDay2Name=--
WeatherDay2Min=--
WeatherDay2Max=--
WeatherDay2Desc=--
WeatherDay3Name=--
WeatherDay3Min=--
WeatherDay3Max=--
WeatherDay3Desc=--

; External Configuration & Cache Includes
@IncludeSettings=#@#Settings.inc
@IncludeLanguage=#@#Languages\#Language#.inc
@IncludeDisksVars=#@#Cache\disks-vars.inc
@IncludeWeatherCache=#@#Cache\weather-data.inc
@IncludeHardwareCache=#@#Cache\hardware-data.inc

; --- CSS-like Unified Spacing Tokens ---
GapSection=20
GapTitleBottom=25
GapGroup=14
GapItem=17

SkinHeight=976
DialCenterX=120
DialCenterY=128
CalendarGridTop=290
GpuLoad=0

; Fallback Defaults for Cache & Calculations
WeatherIcon=cloud
WeatherTemp=--
WeatherDesc=--
WeatherCity=--
WeatherLastUpdated=--
WeatherApparent=--
WeatherHumidity=--
WeatherWindSpeed=--
WeatherWindDir=--
WeatherDay1Name=--
WeatherDay1Min=--
WeatherDay1Max=--
WeatherDay1Desc=--
WeatherDay2Name=--
WeatherDay2Min=--
WeatherDay2Max=--
WeatherDay2Desc=--
WeatherDay3Name=--
WeatherDay3Min=--
WeatherDay3Max=--
WeatherDay3Desc=--
Divider4Y=673
HardwareTitleY=693
HardwareCpuY=718
HardwareCpuBarY=732
HardwareRamY=741
HardwareRamBarY=755
HardwareGpuY=764
HardwareGpuBarY=778
HardwareVramY=786

; Event-driven Positioning Helper

[MeasureFetchHolidays]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch-holidays.ps1"
State=Hide
OutputType=ANSI

[MeasureAlign]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\align-sidebar.ps1"
State=Hide
OutputType=ANSI

[MeasureUpdateDisks]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\update-disks.ps1"
State=Hide
OutputType=ANSI

[MeasureDetectIp]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\detect-weather-ip.ps1"
State=Hide
OutputType=ANSI

[MeasureFirstRunAction]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\first-run.ps1"
State=Hide
OutputType=ANSI

[MeasureFirstRun]
Measure=Calc
Formula=#FirstRunDone#
IfEqualValue=0
IfEqualAction=[!CommandMeasure MeasureFirstRunAction "Run"]
UpdateDivider=-1

[MeasureMonitors]
Measure=SysInfo
SysInfoType=NUM_MONITORS
OnChangeAction=[!CommandMeasure MeasureAlign "Run"]

[MeasureWorkAreaW]
Measure=SysInfo
SysInfoType=SCREEN_WIDTH
OnChangeAction=[!CommandMeasure MeasureAlign "Run"]

; Native WebParser Weather Measures & Lua Parser (Zero External Processes)
[MeasureWeatherParent]
Measure=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#WeatherLat#&longitude=#WeatherLon#&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=auto&forecast_days=4
RegExp=(?si)(.*)
UpdateRate=900
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureWeatherScript "Parse()"]

[MeasureWeatherRaw]
Measure=WebParser
Url=[MeasureWeatherParent]
StringIndex=1

[MeasureWeatherScript]
Measure=Script
ScriptFile=#@#Scripts\Weather.lua

; Native System Measures
[MeasureHours]
Measure=Time
Format=%#I

[MeasureMinutes]
Measure=Time
Format=%M

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureCalcHours]
Measure=Calc
Formula=(([MeasureHours] % 12) * 3600 + [MeasureMinutes] * 60 + [MeasureSeconds]) / 43200
DynamicVariables=1

[MeasureCalcMinutes]
Measure=Calc
Formula=([MeasureMinutes] * 60 + [MeasureSeconds]) / 3600
DynamicVariables=1

; CPU & RAM
[MeasureCpuUsage]
Measure=CPU

[MeasureRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=5

[MeasureRamUsed]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureRamUsedPercent]
Measure=PhysicalMemory
Percentual=1
UpdateDivider=2

[MeasureRamPercentCalc]
Measure=Calc
Formula=Round(MeasureRamUsed / MeasureRamTotal * 100)
UpdateDivider=2

; NvBridge Native In-Process Plugin Measures
[MeasureNvCpuModel]
Measure=Plugin
Plugin=NvBridge
Metric=CpuModel
UpdateDivider=10

[MeasureNvCpuTemp]
Measure=Plugin
Plugin=NvBridge
Metric=CpuTemp
UpdateDivider=2

[MeasureNvGpuModel]
Measure=Plugin
Plugin=NvBridge
Metric=GpuModel
UpdateDivider=10

[MeasureNvGpuStats]
Measure=Plugin
Plugin=NvBridge
Metric=GpuSummary
UpdateDivider=2

[MeasureNvGpuLoad]
Measure=Plugin
Plugin=NvBridge
Metric=GpuLoad
MinValue=0
MaxValue=100
UpdateDivider=2

[MeasureNvVramStats]
Measure=Plugin
Plugin=NvBridge
Metric=VramSummary
UpdateDivider=2

[MeasureNvFps]
Measure=Plugin
Plugin=NvBridge
Metric=Fps
UpdateDivider=2

; Calendar Lua Controller
[MeasureLuaCalendar]
Measure=Script
ScriptFile=#@#Scripts\Calendar.lua

