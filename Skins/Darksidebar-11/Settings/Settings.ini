[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=380
SkinHeight=615
BackgroundMode=2
SolidColor=20,22,25,255

; Styling Variables
[Variables]
@IncludeSettingsDefault=#@#Settings.default.inc
@IncludeSettings=#@#Settings.inc
@IncludeLanguage=#@#Languages\#Language#.inc
@IncludeDisksVarsDefault=#@#Cache\disks-vars.default.inc
@IncludeDisksVars=#@#Cache\disks-vars.inc
@IncludeWeatherStatus=#@#Cache\weather-search-status.inc

SkinWidth=380
SkinHeight=615
FontMain=Segoe UI
ColorBg=20,22,25,255
ColorBorder=255,255,255,30
ColorAccent=0,180,255,255
ColorTextPrimary=240,245,255,255
ColorTextSecondary=160,175,195,255
ColorTextMuted=110,125,140,255
CityInput=""

; ------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------
[MeasureCarousel]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\detect-monitors.ps1" -Direction "#Direction#"
DynamicVariables=1
State=Hide
OutputType=ANSI
FinishAction=[!Refresh]

[MeasureAlignSidebar]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\align-sidebar.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!DeactivateConfig "Darksidebar-11\Settings"]

[MeasureAlignSettings]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\align-settings.ps1" -SettingsWidth 380 -SettingsHeight 615
State=Hide
OutputType=ANSI

; InputText for City Search (inline typing + Enter)
[MeasureInputCity]
Measure=Plugin
Plugin=InputText
X=26
Y=198
W=220
H=20
FontSize=8.5
FontFace=#FontMain#
FontColor=240,245,255,255
SolidColor=26,28,32,255
AntiAlias=1
DefaultValue=""
Command1=[!WriteKeyValue Variables WeatherCity "$UserInput$" "#@#Settings.inc"][!CommandMeasure MeasureSearchCity "Run"]

[MeasureSearchCity]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\search-weather-city.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!Refresh "Darksidebar-11\Sidebar"][!Refresh]

[MeasureDetectIp]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\detect-weather-ip.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!Refresh "Darksidebar-11\Sidebar"][!Refresh]

[MeasureRefreshDisks]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\update-disks.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!Refresh "Darksidebar-11\Sidebar"][!Refresh]

[MeasureChooseCalExe]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\choose-app-exe.ps1" -Target "Calendar"
State=Hide
OutputType=ANSI

[MeasureChooseWeatherExe]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\choose-app-exe.ps1" -Target "Weather"
State=Hide
OutputType=ANSI

[MeasureSetAppCalNone]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\set-app-launcher.ps1" -Target "Calendar" -Type "None"
State=Hide
OutputType=ANSI

[MeasureSetAppCalSys]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\set-app-launcher.ps1" -Target "Calendar" -Type "System"
State=Hide
OutputType=ANSI

[MeasureSetAppWeatherNone]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\set-app-launcher.ps1" -Target "Weather" -Type "None"
State=Hide
OutputType=ANSI

[MeasureSetAppWeatherSys]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\set-app-launcher.ps1" -Target "Weather" -Type "System"
State=Hide
OutputType=ANSI

[MeasureSwitchLangRu]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\switch-language.ps1" -NewLang "Russian"
State=Hide
OutputType=ANSI
FinishAction=[!Refresh "Darksidebar-11\Sidebar"][!Refresh]

[MeasureSwitchLangEn]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\switch-language.ps1" -NewLang "English"
State=Hide
OutputType=ANSI
FinishAction=[!Refresh "Darksidebar-11\Sidebar"][!Refresh]

; PlacementEdge Dynamic highlight (Left vs Right)
[MeasureIsPlacementLeft]
Measure=String
String=#PlacementEdge#
IfMatch=(?i)Left
IfMatchAction=[!SetOption MeterEdgeLeft Text "[x] #LangPlaceLeft#"][!SetOption MeterEdgeLeft FontColor "#ColorAccent#"][!SetOption MeterEdgeRight Text "[ ] #LangPlaceRight#"][!SetOption MeterEdgeRight FontColor "#ColorTextSecondary#"]
IfNotMatchAction=[!SetOption MeterEdgeLeft Text "[ ] #LangPlaceLeft#"][!SetOption MeterEdgeLeft FontColor "#ColorTextSecondary#"][!SetOption MeterEdgeRight Text "[x] #LangPlaceRight#"][!SetOption MeterEdgeRight FontColor "#ColorAccent#"]

; Language button highlights
[MeasureIsLang]
Measure=String
String=#Language#
IfMatch=(?i)Russian
IfMatchAction=[!SetOption MeterLangRuBtn Fill "Color 0,180,255,40"][!SetOption MeterLangRuBtn Stroke "Color 0,180,255,120"][!SetOption MeterLangRuTxt FontColor "#ColorAccent#"][!SetOption MeterLangEnBtn Fill "Color 35,35,38,180"][!SetOption MeterLangEnBtn Stroke "Color 255,255,255,20"][!SetOption MeterLangEnTxt FontColor "#ColorTextSecondary#"]
IfNotMatchAction=[!SetOption MeterLangEnBtn Fill "Color 0,180,255,40"][!SetOption MeterLangEnBtn Stroke "Color 0,180,255,120"][!SetOption MeterLangEnTxt FontColor "#ColorAccent#"][!SetOption MeterLangRuBtn Fill "Color 35,35,38,180"][!SetOption MeterLangRuBtn Stroke "Color 255,255,255,20"][!SetOption MeterLangRuTxt FontColor "#ColorTextSecondary#"]

; Calendar App type highlight: None, System, Custom
[MeasureIsCalApp]
Measure=String
String=#CalendarAppType#
IfMatch=(?i)None
IfMatchAction=[!SetOption MeterAppCalNoneBtn Fill "Color 0,180,255,40"][!SetOption MeterAppCalNoneBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppCalNoneTxt FontColor "#ColorAccent#"][!SetOption MeterAppCalSysBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalSysBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalSysTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppCalCustBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalCustBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalCustTxt FontColor "#ColorTextSecondary#"]
[MeasureIsCalAppSys]
Measure=String
String=#CalendarAppType#
IfMatch=(?i)System
IfMatchAction=[!SetOption MeterAppCalSysBtn Fill "Color 0,180,255,40"][!SetOption MeterAppCalSysBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppCalSysTxt FontColor "#ColorAccent#"][!SetOption MeterAppCalNoneBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalNoneBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalNoneTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppCalCustBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalCustBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalCustTxt FontColor "#ColorTextSecondary#"]
[MeasureIsCalAppCust]
Measure=String
String=#CalendarAppType#
IfMatch=(?i)Custom
IfMatchAction=[!SetOption MeterAppCalCustBtn Fill "Color 0,180,255,40"][!SetOption MeterAppCalCustBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppCalCustTxt FontColor "#ColorAccent#"][!SetOption MeterAppCalNoneBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalNoneBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalNoneTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppCalSysBtn Fill "Color 35,35,38,180"][!SetOption MeterAppCalSysBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppCalSysTxt FontColor "#ColorTextSecondary#"]

; Weather App type highlight: None, System, Custom
[MeasureIsWeatherApp]
Measure=String
String=#WeatherAppType#
IfMatch=(?i)None
IfMatchAction=[!SetOption MeterAppWeatherNoneBtn Fill "Color 0,180,255,40"][!SetOption MeterAppWeatherNoneBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppWeatherNoneTxt FontColor "#ColorAccent#"][!SetOption MeterAppWeatherSysBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherSysBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherSysTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppWeatherCustBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherCustBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherCustTxt FontColor "#ColorTextSecondary#"]
[MeasureIsWeatherAppSys]
Measure=String
String=#WeatherAppType#
IfMatch=(?i)System
IfMatchAction=[!SetOption MeterAppWeatherSysBtn Fill "Color 0,180,255,40"][!SetOption MeterAppWeatherSysBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppWeatherSysTxt FontColor "#ColorAccent#"][!SetOption MeterAppWeatherNoneBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherNoneBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherNoneTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppWeatherCustBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherCustBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherCustTxt FontColor "#ColorTextSecondary#"]
[MeasureIsWeatherAppCust]
Measure=String
String=#WeatherAppType#
IfMatch=(?i)Custom
IfMatchAction=[!SetOption MeterAppWeatherCustBtn Fill "Color 0,180,255,40"][!SetOption MeterAppWeatherCustBtn Stroke "Color 0,180,255,120"][!SetOption MeterAppWeatherCustTxt FontColor "#ColorAccent#"][!SetOption MeterAppWeatherNoneBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherNoneBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherNoneTxt FontColor "#ColorTextSecondary#"][!SetOption MeterAppWeatherSysBtn Fill "Color 35,35,38,180"][!SetOption MeterAppWeatherSysBtn Stroke "Color 255,255,255,20"][!SetOption MeterAppWeatherSysTxt FontColor "#ColorTextSecondary#"]

; Weather Unit highlight: C or F
[MeasureIsUnitC]
Measure=String
String=#WeatherTempUnit#
IfMatch=(?i)C
IfMatchAction=[!SetOption MeterUnitCBtn Fill "Color 0,180,255,40"][!SetOption MeterUnitCBtn Stroke "Color 0,180,255,120"][!SetOption MeterUnitCTxt FontColor "#ColorAccent#"][!SetOption MeterUnitFBtn Fill "Color 35,35,38,180"][!SetOption MeterUnitFBtn Stroke "Color 255,255,255,20"][!SetOption MeterUnitFTxt FontColor "#ColorTextSecondary#"]
IfNotMatchAction=[!SetOption MeterUnitFBtn Fill "Color 0,180,255,40"][!SetOption MeterUnitFBtn Stroke "Color 0,180,255,120"][!SetOption MeterUnitFTxt FontColor "#ColorAccent#"][!SetOption MeterUnitCBtn Fill "Color 35,35,38,180"][!SetOption MeterUnitCBtn Stroke "Color 255,255,255,20"][!SetOption MeterUnitCTxt FontColor "#ColorTextSecondary#"]

; Calendar First Day highlight: Monday or Sunday
[MeasureIsFirstDayMon]
Measure=String
String=#CalendarFirstDay#
IfMatch=(?i)Monday
IfMatchAction=[!SetOption MeterFirstDayMonBtn Fill "Color 0,180,255,40"][!SetOption MeterFirstDayMonBtn Stroke "Color 0,180,255,120"][!SetOption MeterFirstDayMonTxt FontColor "#ColorAccent#"][!SetOption MeterFirstDaySunBtn Fill "Color 35,35,38,180"][!SetOption MeterFirstDaySunBtn Stroke "Color 255,255,255,20"][!SetOption MeterFirstDaySunTxt FontColor "#ColorTextSecondary#"]
IfNotMatchAction=[!SetOption MeterFirstDaySunBtn Fill "Color 0,180,255,40"][!SetOption MeterFirstDaySunBtn Stroke "Color 0,180,255,120"][!SetOption MeterFirstDaySunTxt FontColor "#ColorAccent#"][!SetOption MeterFirstDayMonBtn Fill "Color 35,35,38,180"][!SetOption MeterFirstDayMonBtn Stroke "Color 255,255,255,20"][!SetOption MeterFirstDayMonTxt FontColor "#ColorTextSecondary#"]

; Clock Hand Thickness highlight: Thin, Normal, Thick
[MeasureIsClockThin]
Measure=String
String=#ClockHandThickness#
IfMatch=(?i)Thin
IfMatchAction=[!SetOption MeterClockThinBtn Fill "Color 0,180,255,40"][!SetOption MeterClockThinBtn Stroke "Color 0,180,255,120"][!SetOption MeterClockThinTxt FontColor "#ColorAccent#"][!SetOption MeterClockNormBtn Fill "Color 35,35,38,180"][!SetOption MeterClockNormBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockNormTxt FontColor "#ColorTextSecondary#"][!SetOption MeterClockThickBtn Fill "Color 35,35,38,180"][!SetOption MeterClockThickBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockThickTxt FontColor "#ColorTextSecondary#"]
[MeasureIsClockNormal]
Measure=String
String=#ClockHandThickness#
IfMatch=(?i)Normal
IfMatchAction=[!SetOption MeterClockNormBtn Fill "Color 0,180,255,40"][!SetOption MeterClockNormBtn Stroke "Color 0,180,255,120"][!SetOption MeterClockNormTxt FontColor "#ColorAccent#"][!SetOption MeterClockThinBtn Fill "Color 35,35,38,180"][!SetOption MeterClockThinBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockThinTxt FontColor "#ColorTextSecondary#"][!SetOption MeterClockThickBtn Fill "Color 35,35,38,180"][!SetOption MeterClockThickBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockThickTxt FontColor "#ColorTextSecondary#"]
[MeasureIsClockThick]
Measure=String
String=#ClockHandThickness#
IfMatch=(?i)Thick
IfMatchAction=[!SetOption MeterClockThickBtn Fill "Color 0,180,255,40"][!SetOption MeterClockThickBtn Stroke "Color 0,180,255,120"][!SetOption MeterClockThickTxt FontColor "#ColorAccent#"][!SetOption MeterClockThinBtn Fill "Color 35,35,38,180"][!SetOption MeterClockThinBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockThinTxt FontColor "#ColorTextSecondary#"][!SetOption MeterClockNormBtn Fill "Color 35,35,38,180"][!SetOption MeterClockNormBtn Stroke "Color 255,255,255,20"][!SetOption MeterClockNormTxt FontColor "#ColorTextSecondary#"]

; ------------------------------------------------------------
; METERS: BACKGROUND & HEADER
; ------------------------------------------------------------
[MeterBackground]
Meter=Image
SolidColor=20,22,25,255
X=0
Y=0
W=#SkinWidth#
H=#SkinHeight#

[MeterBorder]
