Shape=Rectangle 0,0,#SkinWidth#,#SkinHeight#,6 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterHeaderTitle]
Meter=String
X=24
Y=16
FontFace=#FontMain#
FontSize=10
FontWeight=700
FontColor=#ColorAccent#
AntiAlias=1
ClipString=1
W=300
Text="DARKSIDEBAR-11 - #LangSettingsTitle#"

[MeterCloseBtn]
Meter=String
X=356
Y=14
StringAlign=Right
FontFace=#FontMain#
FontSize=12
FontWeight=700
FontColor=#ColorTextSecondary#
AntiAlias=1
Text="X"
LeftMouseUpAction=[!DeactivateConfig "Darksidebar-11\Settings"]
Cursor=2

[MeterDividerHeader]
Meter=Shape
X=24
Y=46
Shape=Line 0,0,(#SkinWidth# - 48),0 | Stroke Color #ColorBorder# | StrokeWidth 1

