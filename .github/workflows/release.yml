name: Build & Release RMSKIN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build NativeAOT Plugin & Package .rmskin
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v?(\d+\.\d+\.\d+.*)$') {
              $ver = $Matches[1]
          } else {
              $ver = "1.0.0"
          }
          $pkgName = if ($tag -match '-(beta|rc|alpha)') { "darksidebar-11-beta" } else { "darksidebar-11" }
          Write-Host "Building version: $ver (Package: $pkgName)"
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "PKG_NAME=$pkgName" >> $env:GITHUB_OUTPUT

      - name: Compile NativeAOT NvBridge Plugin
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 src/NvBridgePlugin/NvBridgePlugin.csproj
          $pubDll = "src/NvBridgePlugin/bin/Release/net8.0/win-x64/publish/NvBridgePlugin.dll"
          $targetDll = "Skins/Darksidebar-11/@Resources/Plugins/NvBridge.dll"
          Copy-Item -Path $pubDll -Destination $targetDll -Force

      - name: Build .rmskin Package
        shell: pwsh
        run: |
          pwsh -File ./build-package.ps1 -Version "${{ steps.get_version.outputs.VERSION }}"

      - name: Compute SHA256 Checksum
        shell: pwsh
        run: |
          $file = "dist/Darksidebar-11-v${{ steps.get_version.outputs.VERSION }}.rmskin"
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
          Write-Host "Package SHA256: $hash"
          Set-Content -Path "dist/checksums.txt" -Value "$hash  Darksidebar-11-v${{ steps.get_version.outputs.VERSION }}.rmskin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Darksidebar-11 v${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Darksidebar-11-v${{ steps.get_version.outputs.VERSION }}.rmskin
            dist/checksums.txt
          body: |
            ## Darksidebar-11 v${{ steps.get_version.outputs.VERSION }}
            
            ### Quick Install (1-Click)
            1. Ensure **[Rainmeter](https://www.rainmeter.net/)** (v4.5.18 or higher) is installed.
            2. Download `Darksidebar-11-v${{ steps.get_version.outputs.VERSION }}.rmskin` below.
            3. Double-click the downloaded file and click **Install** in Rainmeter Skin Installer.

            ### Install & Update via UniGetUI (1-Click)
            1. In **UniGetUI**, refresh software sources.
            2. Search for `${{ steps.get_version.outputs.PKG_NAME }}` and click **Install**.

            ### Install & Update via Scoop
            ```powershell
            scoop bucket add darksidebar https://github.com/Anilexis/Darksidebar-11
            scoop install ${{ steps.get_version.outputs.PKG_NAME }}
            
            # To update later:
            scoop update ${{ steps.get_version.outputs.PKG_NAME }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
